x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_WEB3FORMS_ACCESS_KEY: ${NEXT_PUBLIC_WEB3FORMS_ACCESS_KEY:-}
    environment:
      HX_API_URL: http://heat-exchanger:8000
      MEOH_API_URL: http://methanol-reformer:8000
      PUMP_API_URL: http://water-pump:8000
    depends_on:
      - heat-exchanger
      - methanol-reformer
      - water-pump
    restart: unless-stopped
    logging: *logging

  heat-exchanger:
    build: ./simulators/heat-exchanger
    restart: unless-stopped
    logging: *logging

  methanol-reformer:
    build: ./simulators/methanol-reformer
    restart: unless-stopped
    logging: *logging

  water-pump:
    build: ./simulators/water-pump
    restart: unless-stopped
    logging: *logging

  hazop-web:
    build: ./hazop/frontend
    depends_on:
      - hazop-api
    restart: unless-stopped
    logging: *logging

  hazop-api:
    build: ./hazop/backend
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      TRUST_PROXY: "1"
      RATE_JOBS_PER_HOUR: ${HAZOP_RATE_JOBS_PER_HOUR:-10}
      RATE_DOCS_PER_HOUR: ${HAZOP_RATE_DOCS_PER_HOUR:-40}
      RATE_EXPORTS_PER_HOUR: ${HAZOP_RATE_EXPORTS_PER_HOUR:-60}
      AI_JOBS_PER_DAY: ${HAZOP_AI_JOBS_PER_DAY:-50}
      MAX_QUEUED_JOBS: ${HAZOP_MAX_QUEUED_JOBS:-6}
      JOB_TTL_HOURS: ${HAZOP_JOB_TTL_HOURS:-24}
    volumes:
      - hazop_data:/app/data
    restart: unless-stopped
    logging: *logging

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./caddy:/etc/caddy:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - hazop-web
    restart: unless-stopped
    logging: *logging

volumes:
  caddy_data:
  caddy_config:
  hazop_data:
